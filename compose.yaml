# HTTP-Live-Streaming API (HLS + Express on Bun).
#
# Usage (repo root):
#   docker compose up --build       # foreground
#   docker compose up --build -d    # detached
#
# Compose reads `.env` in this directory for ${VAR} substitution (optional).
# Point a dev Next app at http://localhost:3001 via NEXT_PUBLIC_API_BASE.
#

services:
  api:
    build:
      context: .
      dockerfile: server/.Dockerfile
    image: hls-server:latest
    container_name: hls-api
    restart: unless-stopped
    ports:
      # Host binding (host:container) — tune API_PORT in `.env` if 3001 is taken
      - "${API_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      # Matches server defaults; override with CLIENT_ORIGINS in `.env`
      CLIENT_ORIGINS: ${CLIENT_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - hls-uploads:/app/uploads
      - hls-output:/app/hls-output
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  hls-uploads:
  hls-output:
